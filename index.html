<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="Turn your device into a large offline text display." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="logoTx.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="logoTx.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>Big Text Display</title>
  </head>
  <body>
    <main id="app">
      <section class="editor" aria-label="Text display controls">
        <header>
          <div>
            <p class="eyebrow">OFFLINE DISPLAY</p>
            <h1>Big Text</h1>
          </div>
          <button id="installButton" class="install" type="button" hidden>Install app</button>
        </header>

        <p class="input-label">Quick message</p>
        <div id="presetMessages" class="preset-messages" aria-label="Quick messages">
          <button type="button" data-message="SOS">SOS</button>
          <button type="button" data-message="Help">Help</button>
          <button type="button" data-message="Thank you!">Thank you!</button>
          <button type="button" data-message="Sorry">Sorry</button>
        </div>

        <label class="input-label" for="message">Your message</label>
        <textarea id="message" rows="4" placeholder="Type anything…" autofocus></textarea>

        <fieldset class="swatches">
          <legend>Text colour</legend>
          <label><input type="radio" name="colour" value="white" checked><span class="swatch white"></span>White</label>
          <label><input type="radio" name="colour" value="green"><span class="swatch green"></span>Neon green</label>
          <label><input type="radio" name="colour" value="yellow"><span class="swatch yellow"></span>Yellow</label>
          <label><input type="radio" name="colour" value="red"><span class="swatch red"></span>Red</label>
          <label><input type="radio" name="colour" value="custom"><span id="customSwatch" class="swatch custom"></span>Custom</label>
        </fieldset>

        <fieldset id="customColourControls" class="custom-colour" hidden>
          <legend>Custom RGB colour</legend>
          <div class="colour-preview" id="colourPreview" aria-hidden="true"></div>
          <label for="red">Red <output id="redValue" for="red">255</output></label>
          <input id="red" type="range" min="0" max="255" value="255">
          <label for="green">Green <output id="greenValue" for="green">255</output></label>
          <input id="green" type="range" min="0" max="255" value="255">
          <label for="blue">Blue <output id="blueValue" for="blue">255</output></label>
          <input id="blue" type="range" min="0" max="255" value="255">
        </fieldset>

        <label class="toggle"><input id="invert" type="checkbox"><span></span>Invert display</label>
        <button id="showButton" class="show" type="button">Display message</button>
        <button id="shareButton" class="share" type="button">Share message</button>
        <p id="shareStatus" class="share-status" aria-live="polite"></p>
        <p class="hint">Tap the display to return to editing.</p>
      </section>

      <section id="sharedPreview" class="shared-preview" aria-label="Shared message" hidden>
        <p class="eyebrow">SHARED MESSAGE</p>
        <p id="sharedMessageText" class="shared-message-text"></p>
        <button id="displaySharedButton" class="show" type="button">Display message</button>
      </section>

      <section id="display" class="display" aria-label="Full-screen text display" tabindex="0">
        <div id="displayText" class="display-text">Type a message to begin</div>
        <div class="display-tip">Tap anywhere to edit</div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
